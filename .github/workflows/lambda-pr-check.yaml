# Minimal reproduction of marketplace.monorepo's lambda-pr-check.yaml, adapted for
# SAV-690's design verification — same job structure and same coverage-guard logic,
# just pointed at this mini repo's smaller path tree so it can be tested end-to-end
# without needing CodeArtifact auth or any org-internal secrets.
#
# Synced to match the FINAL design shipped in PR #634 (reddrummer/marketplace.monorepo)
# after CodeRabbit review: no paths: restriction (detect + coverage-guard run
# unconditionally on every PR), no separate no-op pairing workflow (removed — see
# git history of this file), COVERED is service-qualified.
name: Lambda PR Check

on:
  pull_request:
    branches: [main]
    # SAV-690 (final design, post-CodeRabbit-review): deliberately NO paths:
    # restriction — detect (cheap) and coverage-guard both run unconditionally on
    # every PR. The earlier design restricted this workflow's trigger to
    # apps/demo-service/aws/lambdas/** and paired it with a separate
    # lambda-pr-check-noop.yaml (paths-ignore mirroring this list) so non-matching
    # PRs weren't stuck pending — CodeRabbit found that pairing could produce two
    # check-runs both named "Lambda PR Check / coverage-guard" on the same commit
    # for a PR touching both an in-scope path and something outside both files'
    # lists, which is a real correctness gap (GitHub's required-status-check
    # evaluation for duplicate-named check-runs is understood to key off the
    # latest run per context, not a logical AND). Removing the restriction
    # entirely eliminates the ambiguity outright.

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      lambdas: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            enrolled-hello:
              - 'apps/demo-service/aws/lambdas/enrolled-hello/**'

  check:
    needs: detect
    if: needs.detect.outputs.lambdas != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJSON(needs.detect.outputs.lambdas) }}
    env:
      LAMBDA_DIR: apps/demo-service/aws/lambdas/${{ matrix.lambda }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.LAMBDA_DIR }}/package-lock.json
      - name: Install deps and run tests
        working-directory: ${{ env.LAMBDA_DIR }}
        run: |
          npm ci --ignore-scripts
          npm test

  # SAV-690's core new mechanism. Deliberately NOT gated by `detect`/`needs` — it
  # must always run, unconditionally, so it can't be silently skipped the way
  # `check` can. It is the job that must be marked required on main.
  #
  # COVERED is DERIVED at runtime from detect's own filter definitions above —
  # not a second hand-maintained list. Earlier versions of this job hardcoded
  # COVERED as a separate string, explicitly rejecting dynamic derivation
  # because parsing detect's filters block by hand (awk/grep on raw text) is a
  # fragile, indentation-sensitive mini YAML parser that risks silently
  # producing a wrong or empty result — the exact failure class this job exists
  # to prevent. That objection no longer applies: `yq` (a real, well-tested
  # YAML parser) is confirmed preinstalled on the GitHub-hosted runner image —
  # verified identical between this repo and the real repo's own runners
  # (same Hosted Compute Agent version, same image release tag) via a
  # dedicated throwaway probe workflow. With a hand-maintained COVERED, a PR
  # could add an entry to COVERED without adding the matching detect filter —
  # coverage-guard would pass (COVERED says it's fine) while detect/check never
  # actually test that lambda (CodeRabbit finding on the real repo's PR #634).
  # Deriving COVERED from detect's filters removes the second list entirely —
  # there is nothing left to independently drift out of sync, by construction,
  # not by adding a cross-check on top of two still-separately-maintained lists.
  coverage-guard:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: true — unlike detect/check above, this job runs its
      # own `git fetch` against origin beyond what checkout itself does. On a
      # PRIVATE repo, persist-credentials: false leaves that fetch with no auth
      # at all and it fails outright ("fatal: could not read Username for
      # 'https://github.com'"). This mini repo is public, so that specific
      # failure never reproduces here — persist-credentials: true is set anyway
      # to mirror the real repo's fix exactly (found via that PR's own live CI,
      # not this repo, since anonymous fetch works fine on a public repo).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Fail on lambda dirs not enrolled in this check
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"

          # Derive COVERED from detect's own filters block (single source of
          # truth): extract the filters value (itself a YAML string) via yq,
          # parse THAT as YAML too (double-parse — GitHub Actions stores a
          # step's multi-line `with.filters` as a plain string, not nested
          # YAML), flatten every path-glob value across every named filter,
          # keep only the ones shaped like a lambda path, and reduce each to
          # "<service>/<lambda>" — the same transform used on $changed below,
          # so both sides of the comparison are derived the same way.
          COVERED=$(yq '.jobs.detect.steps[] | select(.id == "filter") | .with.filters' .github/workflows/lambda-pr-check.yaml \
            | yq '.[] | .[]' - \
            | grep -E '^apps/[^/]+/aws/lambdas/[^/]+/' \
            | sed -E 's#^apps/([^/]+)/aws/lambdas/([^/]+)/.*#\1/\2#' \
            | sort -u | tr '\n' ' ')
          echo "Derived COVERED: $COVERED"

          # Two-dot diff (A..B), not three-dot (A...B): three-dot needs a merge-base,
          # which two independent --depth=1 shallow fetches usually don't share — it
          # fails with "fatal: ...: no merge base", silently swallowed inside $(...),
          # making $changed silently empty and this guard vacuously pass regardless
          # of PR content. Two-dot diff compares tree contents directly, no shared
          # history needed.
          #
          # Pathspec MUST end in /** , not just a trailing slash: a pathspec with
          # NO wildcard gets git's special "trailing slash = this whole directory"
          # literal-prefix treatment, but once it contains a `*` (as this one does,
          # for the service segment), git switches to fnmatch/glob semantics for
          # the ENTIRE pathspec — `*` never crosses `/` and there is no `**` to
          # mean "everything under this directory", so 'apps/*/aws/lambdas/' (no
          # trailing **) matches literally nothing. Found via a real repro on
          # this exact pathspec: 0 files matched without **, all expected files
          # matched with it. This is the same class of bug as the real repo's
          # PR #634 — found there via this same mini-repro sync/re-test cycle.
          changed=$(git diff --name-only "origin/${GITHUB_BASE_REF}..HEAD" -- 'apps/*/aws/lambdas/**' \
            | sed -E 's#^apps/([^/]+)/aws/lambdas/([^/]+)/.*#\1/\2#' | sort -u)
          missing=""
          for l in $changed; do
            case " $COVERED " in *" $l "*) ;; *) missing="$missing $l" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::Lambda dir(s) not enrolled in lambda-pr-check:$missing — add to the paths-filter AND the matrix case block."
            exit 1
          fi
